appId: com.cyrillrx.rpg
---
- launchApp:
    clearState: true

# Navigate to My Collections and create a collection to delete
- tapOn:
    text: "Spells"
- tapOn:
    text: "Create"
- tapOn:
    id: "input_collection_name"
- inputText: "Collection to Delete"
- tapOn:
    text: "Create"
- assertVisible:
    text: "Collection to Delete"

# Swipe LEFT (EndToStart) to trigger the optimistic delete
- swipe:
    direction: LEFT
    duration: 100
    from:
      text: "Collection to Delete"

# Snackbar with Undo should appear
- assertVisible:
    text: "Undo"

# Tap Undo to restore the list
- tapOn:
    text: "Undo"

# Verify the collection is still visible
- assertVisible:
    text: "Collection to Delete"
