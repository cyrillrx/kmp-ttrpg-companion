appId: com.cyrillrx.rpg
---
- launchApp:
    clearState: true

# Navigate to My Collections
- tapOn:
    text: "Spells"

# A first-time user sees the empty state, not an error
- assertVisible:
    text: "No collection yet"

# Open the create-collection dialog
- tapOn:
    text: "New Collection"
- tapOn:
    id: "input_collection_name"
- inputText: "My Test Collection"
- tapOn:
    text: "Create"

# Verify the collection appears in the Collections screen
- assertVisible:
    text: "My Test Collection"
