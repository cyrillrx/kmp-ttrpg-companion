name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release - Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      play_notes: ${{ steps.notes.outputs.play_notes }}

    steps:
      - name: Update the release pull request, or tag the merged one
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4

      # The release is still a draft, which a read-only token cannot see.
      - name: Write the Play release notes
        id: notes
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo 'play_notes<<EOF'
            gh release view "$TAG" --json body --jq .body | .github/scripts/play-release-notes.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN triggers no other workflow, so the builds run here.
  android:
    name: Release - Android to Play internal testing
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.PLAY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_ttrpgReleaseStoreFile: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_ttrpgReleaseStorePassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyAlias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyPassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon

      - name: Write the Play release notes
        env:
          PLAY_NOTES: ${{ needs.release-please.outputs.play_notes }}
        run: |
          mkdir -p whatsnew
          printf '%s\n' "$PLAY_NOTES" > whatsnew/whatsnew-en-US

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cyrillrx.rpg
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
          mappingFile: app/androidApp/build/outputs/mapping/release/mapping.txt

  desktop:
    name: Release - Desktop (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Package the desktop app
        shell: bash
        run: ./gradlew :app:desktopApp:packageReleaseDistributionForCurrentOS --no-daemon

      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" app/desktopApp/build/compose/binaries/main-release/{dmg,msi,deb}/* --clobber

  publish:
    name: Release - Publish
    needs: [release-please, android, desktop]
    if: always() && needs.desktop.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
