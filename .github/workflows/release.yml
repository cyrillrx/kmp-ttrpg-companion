name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release - Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Update the release pull request, or tag the merged one
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  notes:
    name: Release - Notes for testers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      play_en: ${{ steps.notes.outputs.play_en }}
      play_fr: ${{ steps.notes.outputs.play_fr }}
      summary: ${{ steps.notes.outputs.summary }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Rewrite the changelog section for testers
        id: notes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          awk '/^## /{ section++ } section == 1' CHANGELOG.md \
            | .github/scripts/friendly-release-notes.sh >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN triggers no other workflow, so the builds run here.
  android:
    name: Release - Android to Play internal testing
    needs: [release-please, notes, desktop]
    if: needs.release-please.outputs.release_created == 'true' && vars.PLAY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_ttrpgReleaseStoreFile: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_ttrpgReleaseStorePassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyAlias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyPassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon

      - name: Write the Play release notes
        shell: bash
        env:
          PLAY_EN: ${{ needs.notes.outputs.play_en }}
          PLAY_FR: ${{ needs.notes.outputs.play_fr }}
        run: |
          mkdir -p whatsnew
          printf '%s\n' "$PLAY_EN" > whatsnew/whatsnew-en-US
          if [[ -n "$PLAY_FR" ]]; then printf '%s\n' "$PLAY_FR" > whatsnew/whatsnew-fr-FR; fi

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cyrillrx.rpg
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
          mappingFile: app/androidApp/build/outputs/mapping/release/mapping.txt

  desktop:
    name: Release - Desktop (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Package the desktop app
        shell: bash
        run: ./gradlew :app:desktopApp:packageReleaseDistributionForCurrentOS --no-daemon

      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" app/desktopApp/build/compose/binaries/main-release/{dmg,msi,deb}/* --clobber

  publish:
    name: Release - Publish
    needs: [release-please, notes, android, desktop]
    if: always() && needs.notes.result == 'success' && needs.desktop.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release, with the tester summary on top
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SUMMARY: ${{ needs.notes.outputs.summary }}
        run: |
          if [[ -z "$SUMMARY" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            exit 0
          fi

          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          printf '%s\n\n%s\n' "$SUMMARY" "$body" \
            | gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file - --draft=false
