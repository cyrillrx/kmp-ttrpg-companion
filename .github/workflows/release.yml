name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release - Prepare
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Update the release pull request, or tag the merged one
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN triggers no other workflow, so the builds run here.
  android:
    name: Release - Android to Play internal testing
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.PLAY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_ttrpgReleaseStoreFile: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_ttrpgReleaseStorePassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyAlias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ttrpgReleaseKeyPassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon

      - name: Write the Play release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p whatsnew
          gh release view "$TAG" --json body --jq .body \
            | .github/scripts/play-release-notes.sh > whatsnew/whatsnew-en-US

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cyrillrx.rpg
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew

  desktop:
    name: Release - Desktop (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Package the desktop app
        shell: bash
        run: ./gradlew :app:desktopApp:packageReleaseDistributionForCurrentOS --no-daemon

      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" app/desktopApp/build/compose/binaries/main-release/{dmg,msi,deb}/* --clobber
