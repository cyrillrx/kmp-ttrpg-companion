name: KMP Client CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'ktlint-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci-kmp.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'ktlint-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci-kmp.yml'
  workflow_dispatch:

jobs:
  ktlint:
    name: CMP Client - ktlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check formatting and test the ktlint rules
        run: ./gradlew ktlintCheck :ktlint-rules:test --no-daemon

  kmp-tests:
    name: CMP Client - JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify SQLDelight migrations
        run: ./gradlew :app:shared:domain:verifyCommonMainAppDatabaseMigration --no-daemon

      - name: Run JVM tests and generate the Kover report
        run: ./gradlew jvmTest :koverXmlReportJvmOnly --no-daemon

      - name: Upload the Kover report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/reportJvmOnly.xml

  sonar:
    name: CMP Client - SonarCloud
    runs-on: ubuntu-latest
    needs: kmp-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar branch/PR analysis

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download the Kover report
        uses: actions/download-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon --no-configuration-cache
